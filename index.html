<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical Textbooks</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --ink: #1f2933;
    --muted: #6b7280;
    --line: #e3e8ef;
    --accent: #b3122c;        /* First Aid red */
    --accent-soft: #fbe9ec;
    --sidebar-w: 340px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }

  /* Top bar */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    background: linear-gradient(135deg, #8c0d22, var(--accent));
    color: #fff;
    padding: 12px 18px;
  }
  .topbar h1 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: .2px; }
  .topbar .tag { font-size: .82rem; opacity: .85; }
  .menu-btn {
    display: none;
    background: rgba(255,255,255,.15);
    border: 0; color: #fff;
    font-size: 1.1rem; line-height: 1;
    padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }

  /* Layout */
  .layout { flex: 1 1 auto; display: flex; min-height: 0; }

  /* Sidebar */
  .sidebar {
    flex: 0 0 var(--sidebar-w);
    width: var(--sidebar-w);
    background: var(--card);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .filter-wrap { padding: 12px; border-bottom: 1px solid var(--line); }
  #filter {
    width: 100%;
    padding: 9px 12px;
    font-size: .95rem;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--bg);
  }
  #filter:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .search-status { font-size: .76rem; color: var(--muted); padding: 6px 2px 0; min-height: 0; }
  .search-status:empty { display: none; }
  .scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .tree, .results { padding: 6px 6px 24px; }

  /* Search results */
  .result {
    display: block; width: 100%; text-align: left;
    background: none; border: 0; cursor: pointer; font-family: inherit;
    padding: 9px 10px; border-radius: 8px; border-bottom: 1px solid var(--line);
  }
  .result:hover { background: var(--accent-soft); }
  .result .where { font-size: .82rem; font-weight: 650; color: var(--ink); }
  .result .where .pg { color: var(--accent); font-weight: 600; }
  .result .where .subj { color: var(--muted); font-weight: 400; }
  .result .snip { font-size: .8rem; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .result .snip mark { background: #fff1a8; color: inherit; padding: 0 1px; border-radius: 2px; }
  .no-hits { color: var(--muted); font-size: .85rem; padding: 14px 10px; }

  .book-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px; cursor: pointer; user-select: none;
    border-radius: 8px;
  }
  .book-head:hover { background: var(--bg); }
  .book-head .icon { font-size: 1.4rem; line-height: 1; }
  .book-head .title { flex: 1; font-weight: 650; font-size: 1rem; }
  .book-head .sub { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
  .chev { color: var(--muted); transition: transform .2s ease; font-size: .8rem; }
  .open > .book-head .chev,
  .subject.open > .subject-head .chev { transform: rotate(90deg); }

  .chapters { display: none; }
  .book.open > .chapters { display: block; }

  .subject-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px 8px 16px; cursor: pointer; user-select: none;
    border-radius: 8px;
  }
  .subject-head:hover { background: var(--bg); }
  .subject-head .name { flex: 1; font-weight: 600; font-size: .9rem; }
  .subject-head .count {
    color: var(--accent); background: var(--accent-soft);
    border-radius: 999px; font-size: .72rem; font-weight: 600; padding: 1px 8px;
  }
  .subject-head .chev { font-size: .72rem; }
  .sections { display: none; }
  .subject.open > .sections { display: block; }

  .sec {
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left;
    background: none; border: 0; cursor: pointer;
    padding: 7px 10px 7px 30px;
    border-radius: 8px;
    color: var(--ink); font-size: .88rem;
    font-family: inherit;
  }
  .sec::before { content: "\1F4C4"; font-size: .85rem; }
  .sec:hover { background: var(--accent-soft); color: var(--accent); }
  .sec.active { background: var(--accent); color: #fff; font-weight: 600; }
  .sec.active::before { filter: grayscale(1) brightness(3); }

  /* Viewer */
  .viewer { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  .viewer-bar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--line);
    min-height: 46px;
  }
  .viewer-bar .crumb { flex: 1; font-size: .92rem; font-weight: 600; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer-bar .crumb .sub { color: var(--muted); font-weight: 400; }
  .viewer-bar a.pop {
    font-size: .82rem; color: var(--accent); text-decoration: none;
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 10px; white-space: nowrap;
  }
  .viewer-bar a.pop:hover { background: var(--accent-soft); }
  .viewer-bar a.pop[hidden] { display: none; }

  .frame-wrap { flex: 1 1 auto; position: relative; background: #525659; min-height: 0; }
  #pdf { width: 100%; height: 100%; border: 0; display: none; }
  .placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #cfd4da; text-align: center; padding: 24px; gap: 8px;
  }
  .placeholder .big { font-size: 2.6rem; }
  .placeholder.hidden { display: none; }

  /* Mobile */
  @media (max-width: 760px) {
    .menu-btn { display: inline-block; }
    .layout { position: relative; }
    .sidebar {
      position: absolute; z-index: 20; top: 0; bottom: 0; left: 0;
      box-shadow: 0 0 0 100vw rgba(0,0,0,.35);
      transform: translateX(-100%); transition: transform .22s ease;
      max-width: 86vw;
    }
    .sidebar.show { transform: translateX(0); }
  }
</style>
</head>
<body>
<div class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="Toggle navigation">&#9776;</button>
  <h1>Medical Textbooks</h1>
  <span class="tag">click a section to read it here</span>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="filter-wrap">
      <input id="filter" type="search" placeholder="Search content…" autocomplete="off">
      <div class="search-status" id="searchStatus"></div>
    </div>
    <div class="scroll">
      <nav class="tree" id="nav"></nav>
      <div class="results" id="results" hidden></div>
    </div>
  </aside>

  <section class="viewer">
    <div class="viewer-bar">
      <div class="crumb" id="crumb">No section selected</div>
      <a class="pop" id="popout" target="_blank" rel="noopener" hidden>Open in new tab&nbsp;&#8599;</a>
    </div>
    <div class="frame-wrap">
      <iframe id="pdf" title="PDF viewer"></iframe>
      <div class="placeholder" id="placeholder">
        <div class="big">&#128218;</div>
        <div>Select a section from the left to read it here.</div>
      </div>
    </div>
  </section>
</div>

<script src="manifest.js"></script>
<script>
  const nav = document.getElementById('nav');
  const results = document.getElementById('results');
  const searchStatus = document.getElementById('searchStatus');
  const filterBox = document.getElementById('filter');
  const pdf = document.getElementById('pdf');
  const placeholder = document.getElementById('placeholder');
  const crumb = document.getElementById('crumb');
  const popout = document.getElementById('popout');
  const sidebar = document.getElementById('sidebar');
  const menuBtn = document.getElementById('menuBtn');

  // Encode each path segment so spaces/commas in folder and file names resolve.
  function href(path) {
    return path.split('/').map(encodeURIComponent).join('/');
  }

  // Warm the browser cache so the PDF is (partly) downloaded before the click.
  const prefetched = new Set();
  function prefetch(file) {
    const u = href(file);
    if (prefetched.has(u)) return;
    prefetched.add(u);
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = u;
    document.head.appendChild(link);
  }
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  let activeBtn = null;
  function setActive(btn) {
    if (activeBtn) activeBtn.classList.remove('active');
    activeBtn = btn || null;
    if (btn) btn.classList.add('active');
  }

  // Load a PDF into the right pane, optionally jumping to a page.
  let currentFile = null;
  function loadPdf(file, name, subject, page) {
    const base = href(file);
    const url = page ? base + '#page=' + page : base;
    if (file === currentFile) {
      // Same document already open: reset so the viewer re-navigates (e.g. page jump).
      pdf.src = 'about:blank';
      requestAnimationFrame(function () { pdf.src = url; });
    } else {
      // Different document: load directly — avoids an extra blank navigation.
      pdf.src = url;
    }
    currentFile = file;
    pdf.style.display = 'block';
    placeholder.classList.add('hidden');

    crumb.innerHTML = '';
    crumb.appendChild(document.createTextNode(name + ' '));
    crumb.appendChild(el('span', 'sub', '· ' + subject + (page ? ' · p.' + page : '')));
    popout.href = url;
    popout.hidden = false;

    // Close the drawer on mobile after picking.
    sidebar.classList.remove('show');
  }

  function render(manifest) {
    (manifest.textbooks || []).forEach(function (tb, bookIdx) {
      const book = el('div', 'book');

      const head = el('div', 'book-head');
      head.appendChild(el('span', 'icon', tb.icon || '📘'));
      const t = el('span', 'title', tb.title);
      t.appendChild(el('span', 'sub',
        [tb.edition, tb.sectionCount + ' sections'].filter(Boolean).join('  ·  ')));
      head.appendChild(t);
      head.appendChild(el('span', 'chev', '❯'));
      head.addEventListener('click', function () { book.classList.toggle('open'); });
      book.appendChild(head);

      const chapters = el('div', 'chapters');
      (tb.chapters || []).forEach(function (ch) {
        const subj = el('div', 'subject');

        const sHead = el('div', 'subject-head');
        sHead.appendChild(el('span', 'name', ch.subject));
        sHead.appendChild(el('span', 'count', String(ch.sections.length)));
        sHead.appendChild(el('span', 'chev', '❯'));
        sHead.addEventListener('click', function () { subj.classList.toggle('open'); });
        subj.appendChild(sHead);

        const secs = el('div', 'sections');
        ch.sections.forEach(function (sec) {
          const btn = el('button', 'sec', sec.name);
          const warm = function () { prefetch(sec.file); };
          btn.addEventListener('mouseenter', warm);
          btn.addEventListener('touchstart', warm, { passive: true });
          btn.addEventListener('click', function () {
            setActive(btn);
            loadPdf(sec.file, sec.name, ch.subject);
          });
          secs.appendChild(btn);
        });
        subj.appendChild(secs);
        chapters.appendChild(subj);
      });
      book.appendChild(chapters);
      nav.appendChild(book);

      if (bookIdx === 0) book.classList.add('open'); // expand first textbook
    });
  }

  if (window.MANIFEST) {
    render(window.MANIFEST);
  } else {
    nav.innerHTML = '<p style="padding:16px;color:#6b7280">manifest.js not found. ' +
      'Run <code>python generate_manifest.py</code>.</p>';
  }

  // ---- Full-text search (assets lazy-loaded on first use) ----
  let mini = null, byId = null, miniReady = false, miniLoading = false;

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = function () { reject(new Error('failed to load ' + src)); };
      document.head.appendChild(s);
    });
  }

  function ensureSearch() {
    if (miniReady || miniLoading) return Promise.resolve();
    miniLoading = true;
    searchStatus.textContent = 'Loading search index…';
    return loadScript('minisearch.min.js')
      .then(function () { return loadScript('search-docs.js'); })
      .then(function () {
        byId = window.SEARCH_DOCS;
        mini = new MiniSearch({
          fields: ['text', 'section', 'subject'],
          storeFields: ['subject', 'section', 'file', 'page'],
          searchOptions: { prefix: true, fuzzy: 0.2, boost: { section: 3, subject: 2 } }
        });
        mini.addAll(byId);
        miniReady = true;
        searchStatus.textContent = '';
      })
      .catch(function () { searchStatus.textContent = 'Search unavailable.'; })
      .then(function () { miniLoading = false; });
  }

  function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

  function snippetHTML(text, terms) {
    const lower = text.toLowerCase();
    let pos = -1;
    terms.forEach(function (t) {
      const i = lower.indexOf(t);
      if (i >= 0 && (pos < 0 || i < pos)) pos = i;
    });
    if (pos < 0) pos = 0;
    const start = Math.max(0, pos - 50);
    let snip = text.slice(start, start + 170);
    if (start > 0) snip = '…' + snip;
    if (start + 170 < text.length) snip += '…';
    let safe = snip.replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
    if (terms.length) {
      const re = new RegExp('(' + terms.map(escapeReg).join('|') + ')', 'gi');
      safe = safe.replace(re, '<mark>$1</mark>');
    }
    return safe;
  }

  function renderResults(q, hits) {
    nav.hidden = true;
    results.hidden = false;
    results.innerHTML = '';
    if (!hits.length) {
      searchStatus.textContent = '';
      results.appendChild(el('div', 'no-hits', 'No matches for “' + q + '”.'));
      return;
    }
    searchStatus.textContent = hits.length + (hits.length === 50 ? '+ results' :
      (hits.length === 1 ? ' result' : ' results'));
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    hits.forEach(function (h) {
      const btn = el('button', 'result');
      const where = el('div', 'where');
      where.appendChild(document.createTextNode(h.section + ' '));
      where.appendChild(el('span', 'subj', '· ' + h.subject + ' '));
      where.appendChild(el('span', 'pg', '· p.' + h.page));
      btn.appendChild(where);
      const snip = el('div', 'snip');
      snip.innerHTML = snippetHTML(byId[h.id].text, terms);
      btn.appendChild(snip);
      const warm = function () { prefetch(h.file); };
      btn.addEventListener('mouseenter', warm);
      btn.addEventListener('touchstart', warm, { passive: true });
      btn.addEventListener('click', function () {
        setActive(null);
        loadPdf(h.file, h.section, h.subject, h.page);
      });
      results.appendChild(btn);
    });
    results.scrollTop = 0;
  }

  function showTree() {
    results.hidden = true;
    results.innerHTML = '';
    nav.hidden = false;
    searchStatus.textContent = '';
  }

  function runSearch(q) {
    ensureSearch().then(function () {
      if (!miniReady) return;
      if (filterBox.value.trim() !== q) return; // a newer query superseded this one
      renderResults(q, mini.search(q).slice(0, 50));
    });
  }

  let searchTimer = null;
  filterBox.addEventListener('input', function () {
    const q = this.value.trim();
    clearTimeout(searchTimer);
    if (!q) { showTree(); return; }
    searchTimer = setTimeout(function () { runSearch(q); }, 150);
  });
  // Warm up the index as soon as the user focuses the box.
  filterBox.addEventListener('focus', ensureSearch, { once: true });

  menuBtn.addEventListener('click', function () { sidebar.classList.toggle('show'); });
</script>
</body>
</html>
